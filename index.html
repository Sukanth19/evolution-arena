<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evolution Arena</title>
  <meta name="description" content="Design a species, release it into a living ecosystem, and watch natural selection decide whether it survives.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2367e3f9' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="panel" aria-label="Controls">
      <h1 class="brand">Evolution Arena</h1>

      <div class="seg" role="tablist" aria-label="Game mode">
        <button class="seg-btn active" role="tab" aria-selected="true" data-mode="ecosystem">Ecosystem</button>
        <button class="seg-btn" role="tab" aria-selected="false" data-mode="duel">Duel</button>
      </div>

      <canvas id="preview" class="preview" aria-label="Preview of your species"></canvas>

      <div class="traits-head">
        <span>Traits <button class="link" id="randomize" title="Random build">shuffle</button></span>
        <span><b id="points-left">0</b> left</span>
      </div>
      <div id="sliders"></div>

      <section id="rival" class="rival" hidden>
        <div class="sub-head">
          <span>Rival · <em id="rival-name"></em></span>
          <button class="link" id="reroll">new rival</button>
        </div>
        <div id="rival-bars" class="rival-bars"></div>
      </section>

      <button id="release" class="primary">Release</button>
      <button id="reset" class="ghost">Reset world</button>

      <dl class="stats">
        <div><dt>Organisms</dt><dd id="s-orgs">0</dd></div>
        <div><dt>Generation</dt><dd id="s-gen">0</dd></div>
        <div><dt id="s-lineage-label">Your lineage</dt><dd id="s-lineage">0</dd></div>
        <div><dt>Species</dt><dd id="s-species">0</dd></div>
        <div><dt>Food</dt><dd id="s-food">0</dd></div>
        <div id="duel-row" hidden><dt>Time left</dt><dd id="s-time">2:00</dd></div>
      </dl>

      <div class="sub-head"><span>Population</span></div>
      <canvas id="chart" class="chart" aria-label="Population over time"></canvas>
      <ul id="legend" class="legend"></ul>
    </aside>

    <main class="stage" id="stage">
      <canvas id="world" aria-label="The arena"></canvas>
      <div id="toasts" class="toasts" aria-live="polite"></div>
      <div id="inspector" class="inspector" hidden></div>
      <div id="overlay" class="overlay" hidden></div>
      <div class="hud">
        <span class="hint">Click a creature to inspect · click empty space to drop food · <kbd>Space</kbd> pause</span>
        <div class="speed" role="group" aria-label="Simulation speed">
          <button data-speed="0" title="Pause">❚❚</button>
          <button data-speed="1" class="active">1×</button>
          <button data-speed="2">2×</button>
          <button data-speed="4">4×</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/sim.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>

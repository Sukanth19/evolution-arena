<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evolution Arena</title>
  <meta name="description" content="Design a species, release it into a petri-dish ecosystem, and watch natural selection decide whether it survives.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f3e6bd' stroke='%231d2326' stroke-width='2'/%3E%3Cellipse cx='15' cy='16' rx='6' ry='4.5' fill='%23d9462b' stroke='%231d2326' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='1.8' fill='%231d2326'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="title">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>Evolution Arena</h1>
        <p>a petri-dish ecosystem</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Game mode">
      <button class="tab active" role="tab" aria-selected="true" data-mode="ecosystem">Ecosystem</button>
      <button class="tab" role="tab" aria-selected="false" data-mode="duel">Duel</button>
    </nav>
    <div class="speed" role="group" aria-label="Simulation speed">
      <span class="clock" id="clock">t 00:00</span>
      <button data-speed="0" title="Pause (Space)">pause</button>
      <button data-speed="1" class="active">1×</button>
      <button data-speed="2">2×</button>
      <button data-speed="4">4×</button>
    </div>
  </header>

  <div class="main">
    <section class="bench" id="stage" aria-label="Petri dish">
      <canvas id="world"></canvas>
      <div id="inspector" class="inspector" hidden></div>
      <div id="overlay" class="overlay" hidden></div>
      <p class="hint">click a cell to inspect it · click the agar to add food · space pauses</p>
    </section>

    <aside class="side">
      <section class="card genome">
        <div class="card-head">
          <div>
            <h2>Genome</h2>
            <p class="sub" id="genome-sub">design your species</p>
          </div>
          <canvas id="specimen" class="specimen" aria-label="Your species"></canvas>
        </div>
        <div class="budget">
          <span>points</span>
          <div class="budget-bar"><b id="budget-fill"></b></div>
          <span class="mono"><b id="points-used">30</b>/30</span>
        </div>
        <div id="traits" class="traits"></div>
        <div class="actions">
          <button id="release" class="btn btn-main">Release</button>
          <button id="randomize" class="btn btn-quiet" title="Random genome">Shuffle</button>
          <button id="reset" class="btn btn-quiet" title="Sterilise the dish">Reset</button>
        </div>
      </section>

      <section id="rival" class="card rival" hidden>
        <div class="card-head">
          <div>
            <h2>Rival</h2>
            <p class="sub" id="rival-name"></p>
          </div>
          <button class="btn btn-quiet small" id="reroll">New rival</button>
        </div>
        <div id="rival-bars" class="rival-bars"></div>
      </section>

      <section class="card">
        <div class="card-head"><h2>Census</h2></div>
        <div class="tiles">
          <div class="tile"><span>cells</span><b id="s-orgs">0</b></div>
          <div class="tile"><span>max gen</span><b id="s-gen">0</b></div>
          <div class="tile accent"><span id="s-lineage-label">yours</span><b id="s-lineage">0</b></div>
          <div class="tile"><span>species</span><b id="s-species">0</b></div>
          <div class="tile"><span>food</span><b id="s-food">0</b></div>
          <div class="tile" id="duel-tile" hidden><span>time left</span><b id="s-time">2:00</b></div>
        </div>
        <canvas id="chart" class="chart" aria-label="Population over time"></canvas>
        <ul id="legend" class="legend"></ul>
      </section>

      <section class="card">
        <div class="card-head"><h2>Field notes</h2></div>
        <ol id="log" class="log" aria-live="polite"></ol>
      </section>
    </aside>
  </div>

  <script src="js/sim.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
